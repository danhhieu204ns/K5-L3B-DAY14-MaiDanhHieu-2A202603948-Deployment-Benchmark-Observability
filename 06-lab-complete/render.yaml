# Template tham khảo cho Render Blueprint. Web service hiện được tạo qua Dashboard.
# Khi dùng Blueprint, đặt bản sao file này tại gốc repository để Render tự đọc.
services:
  - type: web
    name: k5-l3b-day14-maidanhhieu-2a202603948
    runtime: docker
    rootDir: 06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DAILY_BUDGET_USD
        value: "1.0"
